<body class="bg-editorial-gradient font-body text-on-surface min-h-screen flex items-center justify-center p-6">

            </div>

                    intention.</h2>
                <div class="flex items-center gap-4">

                        <img alt="Student avatar" class="w-10 h-10 rounded-full border-2 border-primary"
                            data-alt="portrait of a creative professional woman with glasses in a minimalist bright studio workspace"
                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuAlTrx-5ob18tpSst8a-d1TILT70sjA3h6Muwe3MZvDFNmtAxH498VsrNUzf-0qyPZpHC5N32YrRKbbu3M8zxeLt87oka1DGokmT6WdbUl2rBhPuNDT8jiCheON7CZVYwsv8J8m67bGuU7ANVSnFXBRNHlltsUyTqaS5matygRBf61c7kGMvxqnsZ60yJxrD8GlWMHQz99tjvkQtZu-XU-ZW7QL1rFCmMotDyrWMO6SD1ZEfD-aUlDheykaHitk7rT0KEuTTYKtCfI" />
                        <img alt="Student avatar" class="w-10 h-10 rounded-full border-2 border-primary"

        <!-- Form Column -->
        <section class="glass-panel relative isolate overflow-hidden p-8 md:p-16 flex flex-col justify-center">
            <div
                class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(255,255,255,0.34),transparent_32%),radial-gradient(circle_at_bottom_left,rgba(255,135,219,0.12),transparent_38%),linear-gradient(135deg,rgba(255,255,255,0.12),rgba(255,255,255,0.02))]">

                <!-- Login Form -->

                        <div class="relative">

                        </div>
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between items-center ml-1">
                            <label class="font-label text-sm font-bold text-on-surface" for="password">Password</label>
                            <a class="text-xs font-bold text-primary hover:text-primary-dim transition-colors" href="#">Forgot Password?</a>
                        </div>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-xl">lock</span>
                            <input
                                class="glass-input w-full pl-12 pr-12 py-4 border-none rounded-lg focus:ring-2 focus:ring-primary/20 focus:bg-white/26 transition-all text-on-surface placeholder:text-outline-variant font-medium"

                            <button type="button" id="toggle-password" class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors">
                                <span class="material-symbols-outlined text-xl" id="toggle-icon">visibility_off</span>
                            </button>
                        </div>
                    </div>
                    <!-- Remember me -->
                    <div class="flex items-center gap-3 ml-1">
                        <input type="checkbox" id="remember-me" class="w-4 h-4 rounded accent-primary cursor-pointer" />
                        <label for="remember-me" class="font-label text-sm font-medium text-on-surface cursor-pointer">Remember me</label>
                    </div>
                    <!-- Inline error -->
                    <p id="login-error" class="text-error text-xs font-bold hidden"></p>
                    <button
                        class="w-full py-4 px-6 bg-gradient-to-r from-primary via-primary-container to-tertiary-container text-on-primary font-headline font-bold text-lg rounded-lg shadow-[0_18px_40px_rgba(106,28,246,0.18)] hover:shadow-[0_22px_50px_rgba(106,28,246,0.24)] hover:-translate-y-0.5 transition-all"
                        type="submit">
                        Log In
                    </button>
                </form>
                <div class="mt-10 text-center">
                    <p class="text-on-surface/78 font-medium">
                        Don't have an account?
                        <a class="text-primary font-bold hover:underline ml-1" href="role_base_registration.html">Sign
                            Up</a>

    </main>
    <!-- Support Help FAB -->
    <div class="fixed bottom-8 right-8 hidden lg:block">
        <a class="flex items-center gap-2 px-4 py-2 bg-white/50 backdrop-blur-md rounded-full text-on-surface-variant font-label text-xs font-bold hover:bg-white/80 transition-all"
            href="#">
            <span class="material-symbols-outlined text-sm">help</span>
            Need Help?
        </a>
    </div>

    <script>
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const toggleBtn = document.getElementById('toggle-password');
        const toggleIcon = document.getElementById('toggle-icon');

        // Show/hide password toggle
        toggleBtn.addEventListener('click', () => {
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            toggleIcon.textContent = isHidden ? 'visibility' : 'visibility_off';
        });

        function showError(msg) {
            loginError.textContent = msg;
            loginError.classList.remove('hidden');
        }
        function clearError() {
            loginError.classList.add('hidden');
        }

        // Real-time ID/Email check
        emailInput.addEventListener('input', () => {
            const val = emailInput.value.trim().toLowerCase();
            const isEmail = val.endsWith('@student.uts.edu.my') || val.endsWith('@uts.edu.my');
            const isID = /^[a-z]{3}\d{8}$/.test(val);
            const valid = val === '' || isEmail || isID;
            if (!valid) {
                showError('Please enter a valid Student ID (e.g. UTS20230001) or a UTS university email.');
                emailInput.classList.add('ring-2', 'ring-error/20');
            } else {
                clearError();
                emailInput.classList.remove('ring-2', 'ring-error/20');
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearError();
            const raw = emailInput.value.trim();
            const emailField = raw.toLowerCase();
            const password = passwordInput.value;

            const isEmailLike = emailField.includes('@');
            if (isEmailLike) {
                if (!emailField.endsWith('@student.uts.edu.my') && !emailField.endsWith('@uts.edu.my')) {
                    showError('Access restricted to UTS university emails only.');
                    emailInput.classList.add('ring-2', 'ring-error/20');
                    return;
                }
            }

            loginForm.querySelector('button[type="submit"]').disabled = true;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ emailOrId: raw, password })
                });
                const payload = await res.json().catch(() => ({}));
                if (!res.ok) {
                    showError(payload.error || 'Sign in failed.');
                    return;
                }
                window.location.href = payload.redirect || '/student/student/dashboard/student_dashboard_new.html';
            } catch (err) {
                showError('Cannot reach server. Run npm start and open this site at http://localhost:3000.');
            } finally {
                loginForm.querySelector('button[type="submit"]').disabled = false;
            }
        });
    </script>
