<!DOCTYPE html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Discussion Forum | Course Selection</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
      body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
      h1, h2, h3 { font-family: "Plus Jakarta Sans", Inter, system-ui, sans-serif; }
      .font-label { font-family: Manrope, Inter, system-ui, sans-serif; }
    </style>
    <link rel="stylesheet" href="../assets/css/student-nav.css">
  </head>

  <body class="bg-surface text-on-background min-h-screen">
    <div id="nav-mount"></div>

    <main class="flex-1 p-4 sm:p-6 lg:p-8 pb-32 overflow-x-hidden min-w-0 flex gap-8 items-start">
      <section class="flex-1 min-w-0">
        <div class="relative">
          <div class="absolute inset-0 -z-10 pointer-events-none">
            <div class="absolute top-[-10%] right-[-10%] w-[55%] h-[55%] bg-primary/10 blur-[120px] rounded-full"></div>
            <div class="absolute bottom-[-10%] left-[-10%] w-[45%] h-[45%] bg-tertiary/10 blur-[100px] rounded-full"></div>
          </div>

          <div class="flex items-start justify-between gap-6">
            <div>
              <h1 class="text-4xl font-headline font-black tracking-tight">Discussion Forum</h1>
              <p class="mt-2 text-sm text-on-surface-variant max-w-2xl">
                Select a course to open its forum.
              </p>
            </div>
          </div>

          <div id="app" class="mt-8"></div>
        </div>
      </section>
    </main>

    <script src="../assets/js/student-nav.js"></script>
    <script>
      (function () {
        const app = document.getElementById('app');
        if (!app) return;

        // Demo enrolled courses (replace with real enrollment data later).
        const enrolledCourses = ['Web Technology', 'Human Computer Interaction'];
        const createdCourses = []; // students: keep empty for now

        const courseMeta = {
          'Web Technology': { icon: 'language', colorClass: 'bg-primary/10 text-primary' },
          'Human Computer Interaction': { icon: 'mouse', colorClass: 'bg-secondary-container/20 text-secondary-fixed-dim' },
          'Algorithm and Design Complexity': { icon: 'science', colorClass: 'bg-tertiary/10 text-tertiary' },
        };

        function chip(label, cls) {
          return `<span class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest border ${cls}">${label}</span>`;
        }

        function renderList() {
          const courses = Array.from(new Set([...enrolledCourses, ...createdCourses]));
          app.innerHTML = `
            <div class="flex flex-col gap-6">
              <div class="flex items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                  <span class="material-symbols-outlined text-primary">school</span>
                  <h2 class="text-xl font-headline font-bold">Your Courses</h2>
                </div>
                <div class="text-xs text-on-surface-variant font-bold font-label">
                  Showing ${courses.length} course(s)
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5">
                ${courses.map((name) => {
                  const meta = courseMeta[name] || { icon: 'school', colorClass: 'bg-primary/10 text-primary' };
                  const enrolled = enrolledCourses.includes(name);
                  const created = createdCourses.includes(name);
                  const roleChips = [
                    enrolled ? chip('Enrolled', 'bg-green-100 text-green-700 border-green-200') : '',
                    created ? chip('Created', 'bg-primary/10 text-primary border-primary/20') : '',
                  ].filter(Boolean).join('');

                  return `
                    <button
                      type="button"
                      data-course-card="1"
                      data-course-name="${String(name).replaceAll('"', '&quot;')}"
                      class="group text-left bg-surface-container-lowest rounded-2xl border border-outline-variant/10 hover:border-primary/20 hover:shadow-md transition-all p-6 relative overflow-hidden"
                    >
                      <div class="absolute -top-10 -right-10 w-28 h-28 ${meta.colorClass} opacity-10 rounded-full blur-2xl"></div>
                      <div class="flex items-start gap-4">
                        <div class="w-12 h-12 ${meta.colorClass} rounded-xl flex items-center justify-center">
                          <span class="material-symbols-outlined text-2xl">${meta.icon}</span>
                        </div>
                        <div class="flex-1 min-w-0">
                          <h3 class="font-headline font-black text-on-surface group-hover:text-primary transition-colors text-lg truncate">${name}</h3>
                          <div class="mt-3 flex gap-2 flex-wrap">${roleChips}</div>
                          <div class="mt-4 text-xs text-on-surface-variant font-label">Forum threads</div>
                        </div>
                        <div class="material-symbols-outlined text-slate-300 group-hover:text-primary transition-colors">
                          arrow_forward
                        </div>
                      </div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          `;

          app.querySelectorAll('button[data-course-card="1"]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const courseName = btn.getAttribute('data-course-name') || '';
              window.location.href = `community_forum.html?course=${encodeURIComponent(courseName)}`;
            });
          });
        }

        renderList();
      })();
    </script>
  </body>
</html>
