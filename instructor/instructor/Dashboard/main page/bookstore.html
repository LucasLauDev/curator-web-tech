<!DOCTYPE html>

<html class="light" lang="en">

<head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>CuratorEdu Bookstore</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap"
                rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
                rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
                rel="stylesheet" />
        <script id="tailwind-config">
                tailwind.config = {
                        darkMode: "class",
                        theme: {
                                extend: {
                                        "colors": {
                                                "error": "#b41340",
                                                "surface-variant": "#dadddf",
                                                "tertiary": "#aa008e",
                                                "on-primary-fixed": "#000000",
                                                "on-tertiary-fixed-variant": "#6f005c",
                                                "surface-container-lowest": "#ffffff",
                                                "primary-dim": "#5d00e3",
                                                "surface-dim": "#d1d5d7",
                                                "on-secondary-container": "#004e61",
                                                "outline": "#757778",
                                                "primary-fixed": "#ac8eff",
                                                "outline-variant": "#abadae",
                                                "on-error": "#ffefef",
                                                "surface": "#f5f6f7",
                                                "surface-container": "#e6e8ea",
                                                "primary-container": "#ac8eff",
                                                "secondary-fixed": "#80deff",
                                                "on-secondary": "#e2f6ff",
                                                "on-background": "#2c2f30",
                                                "tertiary-dim": "#96007d",
                                                "on-primary": "#f7f0ff",
                                                "on-surface-variant": "#595c5d",
                                                "primary": "#6a1cf6",
                                                "inverse-surface": "#0c0f10",
                                                "background": "#f5f6f7",
                                                "tertiary-container": "#ff87db",
                                                "surface-bright": "#f5f6f7",
                                                "inverse-on-surface": "#9b9d9e",
                                                "inverse-primary": "#9d79ff",
                                                "on-primary-container": "#2a0070",
                                                "secondary-dim": "#00576c",
                                                "error-container": "#f74b6d",
                                                "tertiary-fixed-dim": "#ff6ad8",
                                                "secondary-fixed-dim": "#37d4ff",
                                                "secondary-container": "#80deff",
                                                "on-tertiary-fixed": "#34002a",
                                                "on-error-container": "#510017",
                                                "primary-fixed-dim": "#a07dff",
                                                "error-dim": "#a70138",
                                                "on-tertiary": "#ffeef5",
                                                "surface-tint": "#6a1cf6",
                                                "on-tertiary-container": "#5f004f",
                                                "secondary": "#00647b",
                                                "on-surface": "#2c2f30",
                                                "on-primary-fixed-variant": "#350088",
                                                "surface-container-low": "#eff1f2",
                                                "on-secondary-fixed": "#003a48",
                                                "tertiary-fixed": "#ff87db",
                                                "on-secondary-fixed-variant": "#00586d",
                                                "surface-container-highest": "#dadddf",
                                                "surface-container-high": "#e0e3e4"
                                        },
                                        "borderRadius": {
                                                "DEFAULT": "1rem",
                                                "lg": "2rem",
                                                "xl": "3rem",
                                                "full": "9999px"
                                        },
                                        "fontFamily": {
                                                "headline": ["Plus Jakarta Sans"],
                                                "body": ["Inter"],
                                                "label": ["Manrope"]
                                        }
                                },
                        },
                }
        </script>
        <style>
                .material-symbols-outlined {
                        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
                }

                .hide-scrollbar::-webkit-scrollbar {
                        display: none;
                }

                .hide-scrollbar {
                        -ms-overflow-style: none;
                        scrollbar-width: none;
                }
                .bg-dots {
                        background-image: radial-gradient(#6a1cf6 0.5px, transparent 0.5px);
                        background-size: 24px 24px;
                }
        </style>
        <link rel="stylesheet" href="../../assets/css/instructor-nav.css">
</head>

<body class="bg-background text-on-background font-body selection:bg-primary-container selection:text-on-primary-container relative min-h-screen overflow-x-hidden">
        <!-- Background Elements -->
        <div class="fixed inset-0 z-[-1] pointer-events-none overflow-hidden">
                <div class="absolute inset-0 bg-dots opacity-[0.03]"></div>
                <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary/5 blur-[120px] rounded-full"></div>
                <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-tertiary/5 blur-[100px] rounded-full"></div>
        </div>
        
        <div id="nav-mount"></div>

<main class="flex-1 px-6 pb-24 md:pb-8 pt-6 overflow-x-hidden min-w-0">
                        <!-- Page Header -->
                        <header class="mb-8">
                                <h2 class="text-4xl md:text-5xl font-black font-headline tracking-tighter text-on-background mb-2">Bookstore</h2>
                                <p class="text-on-surface-variant max-w-lg">Hand-picked literature for the next generation of digital architects and creators.</p>
                        </header>

                        <!-- Main area: filter panel + book grid -->
                        <div class="flex flex-col lg:flex-row gap-8 items-start">

                        <!-- Left Filter Panel -->
                        <aside class="w-full lg:w-64 flex-shrink-0 space-y-4 lg:sticky lg:top-24">
                                <!-- Search -->
                                <div class="relative">
                                        <input id="bookstore-search" type="text" placeholder="Search by title or author…" class="w-full bg-surface-container-lowest border border-surface-container rounded-2xl pl-12 pr-4 py-3.5 text-sm font-body text-on-surface placeholder:text-on-surface-variant focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all"/>
                                        <span class="material-symbols-outlined absolute left-0 inset-y-0 w-12 flex items-center justify-center text-on-surface-variant text-sm">search</span>
                                </div>
                                <!-- Categories -->
                                <div class="bg-surface-container-lowest rounded-2xl p-5 border border-surface-container">
                                        <p class="font-label text-[10px] font-black uppercase tracking-[0.2em] text-on-surface-variant mb-4">Categories</p>
                                        <div class="space-y-3" id="category-checkboxes">
                                                <label class="flex items-center gap-3 cursor-pointer group">
                                                        <input type="checkbox" data-cat="all" checked class="w-4 h-4 accent-primary rounded"/>
                                                        <span class="font-label text-sm font-bold text-on-surface group-hover:text-primary transition-colors">All Topics</span>
                                                </label>
                                                <label class="flex items-center gap-3 cursor-pointer group">
                                                        <input type="checkbox" data-cat="business" class="w-4 h-4 accent-primary rounded"/>
                                                        <span class="font-label text-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Business</span>
                                                </label>
                                                <label class="flex items-center gap-3 cursor-pointer group">
                                                        <input type="checkbox" data-cat="design" class="w-4 h-4 accent-primary rounded"/>
                                                        <span class="font-label text-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Design</span>
                                                </label>
                                                <label class="flex items-center gap-3 cursor-pointer group">
                                                        <input type="checkbox" data-cat="tech" class="w-4 h-4 accent-primary rounded"/>
                                                        <span class="font-label text-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Technology</span>
                                                </label>
                                                <label class="flex items-center gap-3 cursor-pointer group">
                                                        <input type="checkbox" data-cat="self-help" class="w-4 h-4 accent-primary rounded"/>
                                                        <span class="font-label text-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Self-Help</span>
                                                </label>
                                                <label class="flex items-center gap-3 cursor-pointer group">
                                                        <input type="checkbox" data-cat="philosophy" class="w-4 h-4 accent-primary rounded"/>
                                                        <span class="font-label text-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Philosophy</span>
                                                </label>
                                        </div>
                                </div>
                                <!-- Price Range -->
                                <div class="bg-surface-container-lowest rounded-2xl p-5 border border-surface-container">
                                        <p class="font-label text-[10px] font-black uppercase tracking-[0.2em] text-on-surface-variant mb-4">Price Range</p>
                                        <input id="price-range" type="range" min="0" max="100" value="100" class="w-full h-2 bg-surface-container rounded-lg appearance-none cursor-pointer accent-primary"/>
                                        <div class="flex justify-between mt-2 text-xs text-on-surface-variant font-label font-bold">
                                                <span>RM 0</span>
                                                <span>Up to RM <span id="price-label">100</span></span>
                                        </div>
                                </div>
                        </aside>

                        <!-- Right: Book grid area -->
                        <div class="flex-1 min-w-0">
                        <!-- Special Offer Banner -->
                        <div id="bookstore-banner" class="mb-8 w-full">
                                <div class="relative w-full h-64 md:h-72 bg-violet-600 rounded-2xl overflow-hidden p-8 flex flex-col justify-center text-white shadow-xl shadow-violet-500/10">
                                        <img alt="Library Interior" class="absolute inset-0 w-full h-full object-cover opacity-30 mix-blend-overlay" src="https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=1600&auto=format&fit=crop" />
                                        <div class="relative z-10 max-w-2xl">
                                                <span class="inline-block px-3 py-1 bg-white/20 backdrop-blur-md rounded-full text-[10px] font-label font-bold uppercase tracking-[0.2em] mb-4">Limited Collection</span>
                                                <h2 class="text-4xl md:text-5xl font-black font-headline leading-tight mb-4">Summer Reading Bundle</h2>
                                                <p class="font-body text-white/80 mb-6 text-lg">Get 5 of our top-rated business and design books for the price of 3.</p>
                                                <button type="button" class="claim-bundle-btn px-8 py-3 bg-white text-primary rounded-xl font-headline font-extrabold text-sm hover:scale-105 transition-transform">Claim Bundle</button>
                                        </div>
                                </div>
                        </div>

                        <!-- Book Grid — populated from /api/bookstore/books -->
                        <div id="bookstore-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-6">
                        </div>
                        </div><!-- end right column -->
                        </div><!-- end flex row -->
                </main>
        <script src="/assets/js/bookstore-catalog.js"></script>
        <script src="../../assets/js/instructor-nav.js"></script>
        <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await window.mountCuratorBookstoreGrid({
                gridSelector: '#bookstore-grid',
                bundleBannerSelector: '#bookstore-banner',
                excludeTitle: 'Summer Reading Bundle'
            });

            // Price range slider
            const priceRange = document.getElementById('price-range');
            const priceLabel = document.getElementById('price-label');
            const bookstoreSearch = document.getElementById('bookstore-search');

            const applyFilters = () => {
                const maxPrice = priceRange ? parseFloat(priceRange.value) : 100;
                const query = bookstoreSearch ? bookstoreSearch.value.toLowerCase().trim() : '';

                // Gather checked categories
                const checkedCats = [];
                document.querySelectorAll('#category-checkboxes input[type=checkbox]:checked').forEach(cb => {
                    checkedCats.push(cb.getAttribute('data-cat'));
                });
                const showAll = checkedCats.includes('all') || checkedCats.length === 0;

                document.querySelectorAll('#bookstore-grid .book-card').forEach(card => {
                    const cardCat = card.getAttribute('data-category') || '';
                    const title = (card.querySelector('h3')?.textContent || '').toLowerCase();
                    const author = (card.querySelector('p.text-xs')?.textContent || '').toLowerCase();
                    const priceText = card.querySelector('p.text-lg')?.textContent || '';
                    const priceNum = parseFloat(priceText.replace(/[^0-9.]/g, '')) || 0;

                    const catOk = showAll || checkedCats.includes(cardCat);
                    const priceOk = priceNum <= maxPrice;
                    const searchOk = !query || title.includes(query) || author.includes(query);

                    card.style.display = (catOk && priceOk && searchOk) ? 'flex' : 'none';
                });
            };

            priceRange?.addEventListener('input', () => {
                if (priceLabel) priceLabel.textContent = priceRange.value;
                applyFilters();
            });

            bookstoreSearch?.addEventListener('input', applyFilters);

            document.querySelectorAll('#category-checkboxes input[type=checkbox]').forEach(cb => {
                cb.addEventListener('change', () => {
                    // If "All Topics" is checked, uncheck others; if another is checked, uncheck "All Topics"
                    const allCb = document.querySelector('#category-checkboxes input[data-cat="all"]');
                    if (cb.getAttribute('data-cat') === 'all' && cb.checked) {
                        document.querySelectorAll('#category-checkboxes input:not([data-cat="all"])').forEach(c => c.checked = false);
                    } else if (cb.checked) {
                        if (allCb) allCb.checked = false;
                    }
                    applyFilters();
                });
            });

            const cards = document.querySelectorAll('#bookstore-grid .book-card');
            cards.forEach(card => {
                card.style.transition = 'all 0.4s ease-out';
            });

            // 2. Add filter functionality
            const filterBtns = document.querySelectorAll('.hide-scrollbar button');
            
            // Setup buttons
            filterBtns.forEach(btn => {
                const text = btn.innerText.trim().toLowerCase();
                let cat = text;
                if (text === 'all topics') cat = 'all';
                btn.setAttribute('data-category', cat);
                
                btn.addEventListener('click', () => {
                    // Update active state UI
                    filterBtns.forEach(b => {
                        b.className = "flex-none px-6 py-2 bg-surface-container-high text-on-surface hover:bg-surface-container-highest rounded-full font-label font-bold text-sm transition-colors";
                    });
                    btn.className = "flex-none px-6 py-2 bg-primary text-white rounded-full font-label font-bold text-sm shadow-lg shadow-primary/20";
                    
                    const selectedCat = btn.getAttribute('data-category');
                    
                    // Filter cards with smooth animation
                    cards.forEach(card => {
                        const cardCat = card.getAttribute('data-category');
                        if (selectedCat === 'all' || cardCat === selectedCat) {
                            card.style.display = 'flex';
                            // Short delay to allow display:flex to apply before animating opacity
                            setTimeout(() => {
                                card.style.opacity = '1';
                                card.style.transform = 'scale(1)';
                            }, 10);
                        } else {
                            card.style.opacity = '0';
                            card.style.transform = 'scale(0.95)';
                            setTimeout(() => {
                                // Only hide if it's still supposed to be hidden (prevents flickering if user clicks fast)
                                if (card.style.opacity === '0') {
                                    card.style.display = 'none';
                                }
                            }, 400); // Wait for transition to finish
                        }
                    });
                });
            });
        });
        </script>
</body>
</html>
