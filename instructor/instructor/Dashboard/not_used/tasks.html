<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasks</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/instructor-nav.css" />
    <style>
      body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
      .headline { font-family: "Plus Jakarta Sans", Inter, system-ui, sans-serif; }
      .label { font-family: Manrope, Inter, system-ui, sans-serif; }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="nav-mount"></div>
    <script src="../assets/js/instructor-nav.js"></script>
    <script src="../assets/js/instructor-interactions.js"></script>

    <div class="flex min-h-screen">
      <main class="flex-1 p-8 lg:p-12 pb-28 min-w-0">
        <div class="max-w-5xl mx-auto space-y-8">
          <header class="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
            <div>
              <p class="label text-[10px] uppercase tracking-[0.22em] font-black text-violet-600">Workflow</p>
              <h1 class="headline text-4xl font-black tracking-tight mt-2">Tasks</h1>
              <p class="mt-3 text-sm text-slate-600">Drafting queue, follow-ups, and reminders.</p>
            </div>
            <div class="flex gap-3">
              <button id="tasks-new" class="px-5 py-3 rounded-xl bg-violet-600 text-white font-black hover:bg-violet-700">New task</button>
              <div class="flex bg-white border border-slate-200 rounded-xl overflow-hidden">
                <button class="px-4 py-3 font-black" data-filter="all">All</button>
                <button class="px-4 py-3 font-black text-slate-500" data-filter="open">Open</button>
                <button class="px-4 py-3 font-black text-slate-500" data-filter="done">Done</button>
              </div>
            </div>
          </header>

          <div id="tasks-list" class="space-y-3"></div>
        </div>
      </main>
    </div>
  </body>
</html>
