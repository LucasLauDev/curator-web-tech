<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inbox</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/instructor-nav.css" />
    <style>
      body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
      .headline { font-family: "Plus Jakarta Sans", Inter, system-ui, sans-serif; }
      .label { font-family: Manrope, Inter, system-ui, sans-serif; }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="nav-mount"></div>
    <script src="../assets/js/instructor-nav.js"></script>
    <script src="../assets/js/instructor-interactions.js"></script>

    <div class="flex min-h-screen">
      <main class="flex-1 p-8 lg:p-12 pb-28 min-w-0">
        <div class="max-w-5xl mx-auto space-y-8">
          <header class="flex flex-col md:flex-row md:items-end md:justify-between gap-4">
            <div>
              <p class="label text-[10px] uppercase tracking-[0.22em] font-black text-violet-600">Messages</p>
              <h1 class="headline text-4xl font-black tracking-tight mt-2">Inbox</h1>
              <p class="mt-3 text-sm text-slate-600">System updates, comments, and course reminders.</p>
            </div>
            <div class="flex gap-3">
              <button id="inbox-compose" class="px-5 py-3 rounded-xl bg-violet-600 text-white font-black hover:bg-violet-700">Compose</button>
              <button id="inbox-mark-all" class="px-5 py-3 rounded-xl bg-white border border-slate-200 font-black hover:bg-slate-50">Mark all read</button>
            </div>
          </header>

          <div class="bg-white border border-slate-200 rounded-2xl p-4">
            <div class="relative flex items-center">
              <input id="inbox-search" class="w-full rounded-xl border-slate-200 pl-12 pr-4 py-3 font-semibold focus:ring-2 focus:ring-violet-500/20 outline-none transition-all" placeholder="Search inbox..." />
              <div class="absolute left-0 inset-y-0 w-12 flex items-center justify-center pointer-events-none text-slate-400">
                <span class="material-symbols-outlined">search</span>
              </div>
            </div>
          </div>

          <div id="inbox-list" class="space-y-3"></div>
        </div>
      </main>
    </div>
  </body>
</html>
