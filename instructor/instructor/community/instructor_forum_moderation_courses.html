<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forum Moderation | Course Selection</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="../assets/css/instructor-nav.css" />

    <style>
      body {
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }
      h1,
      h2,
      h3,
      .font-headline {
        font-family: "Plus Jakarta Sans", Inter, system-ui, sans-serif;
      }
      .font-label {
        font-family: Manrope, Inter, system-ui, sans-serif;
      }
    </style>
  </head>

  <body class="bg-background text-on-surface selection:bg-primary-container selection:text-on-primary-container min-h-screen overflow-x-hidden">
    <div id="nav-mount"></div>
    <script src="../assets/js/instructor-nav.js"></script>
    <script src="../assets/js/instructor-interactions.js"></script>

    <div class="flex min-h-screen">
      <main class="flex-1 p-4 sm:p-6 lg:p-8 pb-32 overflow-x-hidden min-w-0 flex gap-8 items-start">
        <section class="flex-1 min-w-0">
          <div class="relative">
            <div class="absolute inset-0 -z-10 pointer-events-none">
          <div class="absolute top-[-10%] right-[-10%] w-[55%] h-[55%] bg-primary/10 blur-[120px] rounded-full"></div>
          <div class="absolute bottom-[-10%] left-[-10%] w-[45%] h-[45%] bg-tertiary/10 blur-[100px] rounded-full"></div>
            </div>

            <div class="flex items-start justify-between gap-6">
              <div>
                <h1 class="text-4xl font-headline font-black tracking-tight">Forum Moderation</h1>
                <p class="mt-2 text-sm text-on-surface-variant max-w-2xl">
                  Select a course to review and moderate its forum.
                </p>
              </div>
            </div>

            <div id="app" class="mt-8"></div>
          </div>
        </section>
      </main>
    </div>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const courseParam = (params.get("course") || "").trim();
        const app = document.getElementById("app");
        if (!app) return;

        // Demo data (no backend yet). Replace with real API later.
        const enrolledCourses = ["Web Technology", "Human Computer Interaction"];
        const createdCourses = ["Algorithm and Design Complexity"];

        const courseMeta = {
          "Web Technology": { icon: "language", colorClass: "bg-primary/10 text-primary", blobClass: "bg-primary/10" },
          "Algorithm and Design Complexity": { icon: "science", colorClass: "bg-tertiary/10 text-tertiary", blobClass: "bg-tertiary/10" },
          "Human Computer Interaction": { icon: "mouse", colorClass: "bg-secondary-container/20 text-secondary-fixed-dim", blobClass: "bg-secondary-container/20" },
        };

        function normalizeCourseName(s) {
          return String(s || "").replace(/\s+/g, " ").trim();
        }

        function uniqueCourses() {
          const set = new Set([...enrolledCourses, ...createdCourses].map(normalizeCourseName));
          return Array.from(set);
        }

        function isEnrolled(name) {
          return enrolledCourses.map(normalizeCourseName).includes(normalizeCourseName(name));
        }

        function isCreated(name) {
          return createdCourses.map(normalizeCourseName).includes(normalizeCourseName(name));
        }

        function chip(label, cls) {
          return `<span class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest border ${cls}">${label}</span>`;
        }

        const targetForumPath = "../Dashboard/main%20page/instructor_forum_moderation.html";

        // If opened with ?course=..., go directly to the existing forum page.
        if (courseParam) {
          const next = `${targetForumPath}?course=${encodeURIComponent(courseParam)}`;
          window.location.href = next;
          return;
        }

        function renderCourseList() {
          const courses = uniqueCourses();

          app.innerHTML = `
            <div class="flex flex-col gap-6">
              <div class="flex items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                  <span class="material-symbols-outlined text-primary">school</span>
                  <h2 class="text-xl font-headline font-bold">Your Courses</h2>
                </div>
                <div class="text-xs text-on-surface-variant font-bold font-label">
                  Showing ${courses.length} course(s)
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-5">
                ${courses
                  .map((name) => {
                    const meta = courseMeta[name] || { icon: "school", colorClass: "bg-primary/10 text-primary", blobClass: "bg-primary/10" };
                    const enrolled = isEnrolled(name);
                    const created = isCreated(name);
                    const roleChips = [
                      enrolled ? chip("Enrolled", "bg-green-100 text-green-700 border-green-200") : "",
                      created ? chip("Created", "bg-primary/10 text-primary border-primary/20") : "",
                    ].filter(Boolean);
                    const threads = 8 + (name.length % 7);
                    return `
                      <button
                        type="button"
                        data-course-card="1"
                        data-course-name="${name.replaceAll('"', "&quot;")}"
                        class="group text-left bg-surface-container-lowest rounded-2xl border border-outline-variant/10 hover:border-primary/20 hover:shadow-md transition-all p-6 relative overflow-hidden"
                      >
                        <div class="absolute -top-10 -right-10 w-28 h-28 ${meta.blobClass} opacity-10 rounded-full blur-2xl"></div>
                        <div class="flex items-start gap-4">
                          <div class="w-12 h-12 ${meta.colorClass} rounded-xl flex items-center justify-center">
                            <span class="material-symbols-outlined text-2xl">${meta.icon}</span>
                          </div>
                          <div class="flex-1 min-w-0">
                            <h3 class="font-headline font-black text-on-surface group-hover:text-primary transition-colors text-lg truncate">${name}</h3>
                            <div class="mt-3 flex gap-2 flex-wrap">${roleChips.join("")}</div>
                            <div class="mt-4 flex items-center justify-between">
                              <div class="text-xs text-on-surface-variant font-label">Forum threads</div>
                              <div class="text-sm font-headline font-black text-on-surface">${threads}</div>
                            </div>
                          </div>
                          <div class="material-symbols-outlined text-slate-300 group-hover:text-primary transition-colors">
                            arrow_forward
                          </div>
                        </div>
                      </button>
                    `;
                  })
                  .join("")}
              </div>

              <div class="rounded-2xl border border-outline-variant/10 bg-surface-container-low p-5">
                <p class="text-sm font-bold text-on-surface-variant">
                  Tip
                </p>
                <p class="mt-1 text-sm text-on-surface-variant">
                  Click a course card to open its forum. You can then review and moderate thread content.
                </p>
              </div>
            </div>
          `;

          app.querySelectorAll("button[data-course-card='1']").forEach((btn) => {
            btn.addEventListener("click", () => {
              const courseName = btn.getAttribute("data-course-name") || "";
              window.location.href = `${targetForumPath}?course=${encodeURIComponent(courseName)}`;
            });
          });
        }
        renderCourseList();
      })();
    </script>
  </body>
</html>
